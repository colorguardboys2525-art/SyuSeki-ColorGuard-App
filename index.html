<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#22C55E">
  <title>出席表アプリ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <!-- Excel読み込み用（SheetJS）。取り込み時のみ使用 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <div id="app">
    <header id="topbar" class="topbar" hidden>
      <div class="topbar-title">
        <span class="topbar-logo" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="9" width="34" height="32" rx="8"/><path d="M16 5v8M32 5v8M7 20h34"/><path d="m17 30 5 5 9-10"/></svg>
        </span>
        <span>出席表</span>
        <span id="roleChip" class="chip"></span>
      </div>
      <button id="logoutBtn" class="btn-small" type="button">ログアウト</button>
    </header>

    <div id="demoBanner" class="demo-banner" hidden>デモモード：Firebase未設定のため、データはこのブラウザ内に保存されます。</div>

    <main id="view"></main>

    <nav id="adminNav" class="admin-nav" aria-label="管理者メニュー" hidden>
      <a href="#/table" data-route="/table">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18M9 10v10"/></svg>
        <span>出席表</span>
      </a>
      <a href="#/copy" data-route="/copy">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
        <span>コピー</span>
      </a>
      <a href="#/memo" data-route="/memo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v12l-5 5H5z"/><path d="M14 21v-5h5M8 9h8M8 13h4"/></svg>
        <span>メモ抽出</span>
      </a>
      <a href="#/filters" data-route="/filters">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
        <span>フィルター</span>
      </a>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
